services:
  - type: web
    name: polar-x
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn backend.app:app
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: polar-x-db
          property: connectionString
      - key: CORS_ORIGINS
        value: "*"

databases:
  - name: polar-x-db
    plan: free
    databaseName: polarx
    user: polarx
